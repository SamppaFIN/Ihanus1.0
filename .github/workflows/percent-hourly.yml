# Tuore data ennen kierroksen sulkeutumista: peliprosentit ja vaihto Ylen Teksti-TV:stä (sivu 479), valinnaisesti
# myös kertoimet, uudelleenlaskenta ja julkaisu.
#
# Pääasiallinen käynnistäjä on Cloudflare Worker (workers/cron), joka kutsuu workflow_dispatchia tuntia ennen
# jokaisen kierroksen "Pelaaminen päättyy" -hetkeä. Alla oleva schedule on varmistus ilman Workeria ja ilman
# yhtään salaisuutta: tunnin välein joka päivä. GitHubin schedule voi myöhästyä, siksi Worker on tarkempi.
name: Peliprosentit
on:
  schedule:
    - cron: '10 7-20 * * *' # joka päivä 07–20 UTC = 09–22 Suomen aikaa (±1 h kesäajasta riippuen); kierroksia on myös arkisin
  workflow_dispatch:
    inputs:
      odds:
        description: 'Hae myös kertoimet (BetExplorer)'
        type: string
        default: 'false'
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  percent:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Hae peliprosentit
        run: |
          set +e
          npm run scrape:percent
          code=$?
          # 3 = sivulla ei Vakio-kohteita (esim. tauko) → ei virhe
          if [ "$code" = "3" ]; then echo "Ei Vakio-kohteita sivulla"; exit 0; fi
          exit $code
      - name: Hae kertoimet (BetExplorer)
        if: ${{ inputs.odds == 'true' }}
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npm run scrape:odds
      - run: npm run build:data
      - name: Commitoi data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/coupons data/crowd-history data/odds web/data
          if git diff --cached --quiet; then echo "Ei muutoksia"; else
            git commit -m "Data: peliprosentit [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: 'Deploy: peliprosentit'
