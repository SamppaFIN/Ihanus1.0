# Pe–su tunnin välein: hae peliprosentit ja vaihto Ylen Teksti-TV:stä (sivu 479), laske uudelleen ja julkaise.
# Näin viimeinen snapshot ennen ottelujen alkua on tuore ("tuntia ennen matsia"); jokainen haku tallentuu
# myös data/crowd-history/-tiedostoon. Jos kierroksia pelataan muinakin päivinä (esim. keskiviikkovakio), lisää päivä cron-riville.
name: Peliprosentit
on:
  schedule:
    - cron: '10 7-20 * * 0,5,6' # su, pe, la; 07–20 UTC = 09–22 Suomen aikaa (hetkellä ±1 h kesäajasta riippuen)
  workflow_dispatch:
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  percent:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Hae peliprosentit
        run: |
          set +e
          npm run scrape:percent
          code=$?
          # 3 = sivulla ei Vakio-kohteita (esim. tauko) → ei virhe
          if [ "$code" = "3" ]; then echo "Ei Vakio-kohteita sivulla"; exit 0; fi
          exit $code
      - run: npm run build:data
      - name: Commitoi data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/coupons data/crowd-history web/data
          if git diff --cached --quiet; then echo "Ei muutoksia"; else
            git commit -m "Data: peliprosentit [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: 'Deploy: peliprosentit'
