# Aamuisin: hae peliprosentit (Teksti-TV 479) ja 1X2-kertoimet (BetExplorer, Playwright — ei API-avaimia),
# rakenna UI:n data ja julkaise.
#
# Kertoimet ovat "paras yritys": jos sivun rakenne on muuttunut tai kertoimia ei löydy, askel ei kaada ajoa
# ja UI käyttää edellistä dataa / pelkkää malliarviota. Ensimmäisellä ajolla (tai kun jokin näyttää väärältä) aja
# käsin "Run workflow" valinnalla debug=true: HTML ja kuvakaappaukset tulevat artefaktina tarkistettavaksi.
name: Kertoimet aamulla
on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC = 07:30 / 08:30 Suomen aikaa
  workflow_dispatch:
    inputs:
      debug:
        description: 'Tallenna BetExplorer-sivujen HTML ja kuvakaappaukset artefaktiksi'
        type: boolean
        default: false
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Hae peliprosentit (jotta uuden kierroksen kuponki on olemassa)
        run: |
          set +e
          npm run scrape:percent
          code=$?
          if [ "$code" = "3" ]; then echo "Ei Vakio-kohteita sivulla"; exit 0; fi
          exit $code
      - run: npx playwright install --with-deps chromium
      - name: Hae kertoimet (BetExplorer)
        continue-on-error: true
        run: npm run scrape:odds -- ${{ inputs.debug && '--debug' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug }}
        with:
          name: betexplorer-debug
          path: data/raw/odds-*
          if-no-files-found: warn
      - run: npm run typecheck && npm test
      - run: npm run build:data
      - name: Commitoi data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/coupons data/crowd-history data/odds web/data
          if git diff --cached --quiet; then echo "Ei muutoksia"; else
            git commit -m "Data: aamun kertoimet ja peliprosentit [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: 'Deploy: aamun data'
