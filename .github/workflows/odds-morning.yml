# Aamuisin: hae 1X2-kertoimet avoimelle kierrokselle, rakenna UI:n data ja julkaise.
#
# Kertoimet haetaan The Odds API:sta (Pinnacle ensisijainen). Lisää repon secrets-kohtaan THE_ODDS_API_KEY.
# Ilman avainta askel päättyy koodiin 2 ja ajo jatkuu ilman uusia kertoimia (UI käyttää edellistä dataa).
# Playwright-kaappaus (veikkaus-capture) on erillinen käsin ajettava askel: ks. input "capture".
name: Kertoimet aamulla
on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC = 07:30 / 08:30 Suomen aikaa
  workflow_dispatch:
    inputs:
      capture:
        description: 'Aja myös Veikkaus-sivun Playwright-kaappaus (tulos artefaktina)'
        type: boolean
        default: false
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Hae kertoimet
        id: odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          set +e
          npm run scrape:odds
          code=$?
          if [ "$code" = "2" ]; then echo "::warning::THE_ODDS_API_KEY puuttuu — kertoimia ei haettu"; exit 0; fi
          exit $code
      - name: Playwright-kaappaus (valinnainen)
        if: ${{ inputs.capture }}
        run: |
          npx playwright install --with-deps chromium
          npm run scrape:veikkaus:capture
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.capture }}
        with:
          name: veikkaus-capture
          path: data/raw/veikkaus-capture-*.json
      - run: npm run typecheck && npm test
      - run: npm run build:data
      - name: Commitoi data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/odds web/data
          if git diff --cached --quiet; then echo "Ei muutoksia"; else
            git commit -m "Data: aamun kertoimet [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: 'Deploy: aamun kertoimet'
